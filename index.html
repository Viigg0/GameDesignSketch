<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameDesignSketch</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0d;
      --card: #17171b;
      --border: #2a2a30;
      --text: #eaeaea;
      --muted: #9a9aa2;
      --accent: #e0b84b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 4rem 1.5rem;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      letter-spacing: 0.02em;
      margin: 0 0 0.25rem;
    }
    p.tagline {
      color: var(--muted);
      margin: 0 0 2.5rem;
      font-size: 0.95rem;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    li {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 10px;
      transition: border-color 0.15s ease;
    }
    li:hover { border-color: var(--accent); }
    a {
      display: block;
      padding: 1rem 1.25rem;
      color: inherit;
      text-decoration: none;
    }
    .title {
      color: var(--accent);
      font-weight: 600;
      font-size: 1rem;
    }
    .blurb {
      color: var(--muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }
    .empty {
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>GameDesignSketch</h1>
    <p class="tagline">Throwaway gameplay-feel prototypes. Read the code at your own risk.</p>
    <ul id="list"><li class="empty" style="border:none;background:none;padding:0.5rem 0;">Loading…</li></ul>
  </main>
  <script type="module">
    const listEl = document.getElementById('list')
    try {
      const res = await fetch('./prototypes.json')
      const prototypes = await res.json()
      listEl.innerHTML = ''
      if (prototypes.length === 0) {
        listEl.innerHTML = '<li class="empty" style="border:none;background:none;padding:0.5rem 0;">No prototypes yet.</li>'
      }
      for (const p of prototypes) {
        const li = document.createElement('li')
        li.innerHTML = `
          <a href="./prototypes/${p.slug}/">
            <div class="title">${p.title}</div>
            <div class="blurb">${p.blurb ?? ''}</div>
          </a>
        `
        listEl.appendChild(li)
      }
    } catch (err) {
      listEl.innerHTML = '<li class="empty" style="border:none;background:none;padding:0.5rem 0;">Could not load prototypes.json</li>'
    }
  </script>
</body>
</html>
